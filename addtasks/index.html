<!DOCTYPE html>
<html>
<head>
  <title>Task App</title>
  <style>
    * { box-sizing: border-box; }

body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
  background: #ffffff;
  color: #111827;
}

.app {
  max-width: 560px;
  margin: 28px auto;
  padding: 0 16px 28px;
}

h1 {
  margin: 8px 0 14px;
  font-size: 28px;
  letter-spacing: -0.02em;
}

.controls {
  display: flex;
  gap: 10px;
  align-items: center;
}

#taskInput {
  flex: 1;
  padding: 12px 12px;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
  outline: none;
  font-size: 14px;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}

#taskInput:focus {
  border-color: #93c5fd;
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
}

#addBtn {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid #2563eb;
  background: #2563eb;
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: transform 120ms ease, filter 160ms ease;
}

#addBtn:hover { filter: brightness(1.05); }
#addBtn:active { transform: translateY(1px); }

.stats {
  display: flex;
  gap: 16px;
  margin-top: 14px;
  color: #374151;
}

@media (max-width: 420px) {
  .controls { flex-direction: column; align-items: stretch; }
  #addBtn { width: 100%; }
  .stats { flex-direction: column; gap: 6px; }
}
    .completed .taskText {
      text-decoration: line-through;
    color: #6b7280;
}

#taskList li {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 10px 12px;
  margin: 10px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  transition: background-color 180ms ease, border-color 180ms ease, transform 120ms ease, opacity 180ms ease;
}

#taskList li:active {
  transform: scale(0.99);
}

#taskList li.completed {
  background: #ecfdf5;      /* light green */
  border-color: #a7f3d0;    /* green border */
}
    
    #taskList li {
      transition: opacity 180ms ease, transform 180ms ease;
      opacity: 1;
  transform: translateY(0);
}

#taskList li.removing {
  opacity: 0;
  transform: translateY(-6px);
}


#taskList button {
  border: 1px solid #e5e7eb;
  background: #fff;
  border-radius: 10px;
  padding: 8px 10px;
  cursor: pointer;
  transition: transform 120ms ease, background-color 160ms ease, border-color 160ms ease;
}

#taskList button:hover {
  background: #f9fafb;
  border-color: #d1d5db;
}

#taskList li:hover {
  border-color: #d1d5db;
}

body.allDone {
  background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 55%);
}
  </style>
</head>
<body>

  <div class="app">
    <h1>Task App</h1>
  
    <div style="margin-bottom: 12px;">
      <button id="loginBtn">Sign in with Google</button>
      <button id="logoutBtn" style="display:none;">Logout</button>
      <span id="userInfo" style="margin-left:8px;"></span>
    </div>
  
    <input id="taskInput" type="text" placeholder="Enter task" disabled>
    <button id="addBtn" disabled>Add</button>
  
    <ul id="taskList"></ul>
  
    <div class="stats">
      <p>Total Tasks: <span id="total">0</span></p>
      <p>Completed Tasks: <span id="completed">0</span></p>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "", // removed for security — replace with a secure value at deploy time
  authDomain: "taskapp-ec293.firebaseapp.com",
  projectId: "taskapp-ec293",
  storageBucket: "taskapp-ec293.firebasestorage.app",
  messagingSenderId: "893083463536",
  appId: "1:893083463536:web:f67fac8673c8424c3e69b5",
  measurementId: "G-EL4J06KNH4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

provider.setCustomParameters({
  prompt: "select_account"
});

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userInfo = document.getElementById("userInfo");
const taskInput = document.getElementById("taskInput");
const addBtn = document.getElementById("addBtn");

loginBtn.addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (err) {
    console.error("Sign in failed:", err);
    alert(err.code || err.message);
  }
});

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    userInfo.textContent = `Hello, ${user.displayName}`;
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline";
    taskInput.disabled = false;
    addBtn.disabled = false;
  } else {
    userInfo.textContent = "";
    loginBtn.style.display = "inline";
    logoutBtn.style.display = "none";
    taskInput.disabled = true;
    addBtn.disabled = true;
  }
});

addBtn.addEventListener("click", addTask);
taskInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") addTask();
});

  function addTask() {
    if (!auth.currentUser) return;
    const task = taskInput.value.trim();
    if (!task) return;

  const li = document.createElement("li");
  const span = document.createElement("span");
  span.className = "taskText";
  span.textContent = task;
  li.appendChild(span);

  const delBtn = document.createElement("button");
  delBtn.textContent = "Delete";
  delBtn.onclick = function (e) {
    e.stopPropagation();
    li.classList.add("removing");
    li.addEventListener("transitionend", function onEnd(ev) {
      if (ev.propertyName !== "opacity") return;
      li.removeEventListener("transitionend", onEnd);
      li.remove();
      updateCount();
    });
  };
  li.appendChild(delBtn);

  li.onclick = function (e) {
    if (e.target.tagName !== "BUTTON") {
      li.classList.toggle("completed");
      updateCount();
    }
  };

  document.getElementById("taskList").appendChild(li);
  taskInput.value = "";
  updateCount();
}

function updateCount() {
  const tasks = document.querySelectorAll("#taskList li");
  const total = tasks.length;
  const completed = document.querySelectorAll("#taskList li.completed").length;

  document.getElementById("total").textContent = total;
  document.getElementById("completed").textContent = completed;
  document.body.classList.toggle("allDone", total > 0 && completed === total);
}
</script>

</body>
</html>
