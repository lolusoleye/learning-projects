<!DOCTYPE HTML>
<head>
    <style>

        body{


            background-color: #000;
            display:flex;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        


        #value{

            font-size: 48px;
            margin-bottom: 10px

        }

    </style>


</head>
<body>

    <p id="value"></p>
    <p id="classification"></p>


    <script>
    async function index() {


        const response = await fetch("https://api.alternative.me/fng/");
        const data = await response.json();
        document.getElementById("value").innerText = data["data"][0]["value"];
        document.getElementById("classification").innerText = data["data"][0]["value_classification"];

        const value = data["data"][0]["value"]

        if (value < 25) {
            document.getElementById("value").style.color = "red"
        } else if (value < 50) {
             document.getElementById("value").style.color = "orange"
        } else if (value < 75) {
            document.getElementById("value").style.color = "yellow"
        } else {
            document.getElementById("value").style.color = "green"
        }

    }

    index();
    </script>



</body>
