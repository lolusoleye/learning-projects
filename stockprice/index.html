<!DOCTYPE html>
<html>
  <head>
    <style> 
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #0d0d0d;
        color: white;
      }

      input {
        padding: 10px;
        border-radius: 8px;
        border: none;
        margin-bottom: 10px;
        width: 200px;
      }

      button {
        padding: 10px 20px;
        background-color: #757575;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      #result {
        margin-top: 20px;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <input id="coinInput" placeholder="Enter coin name">
    <button onclick="getPrice()">Get Price</button>
    <p id="result"></p>

    <script>
      async function getPrice() {
      const coin = document.getElementById("coinInput").value  // define first

  const colors = {
    bitcoin: "#f7931a",
    ethereum: "#627eea",
    solana: "#9945ff",
    ripple: "#00aae4"
  }

  const color = colors[coin] || "#ffffff"
  document.querySelector("button").style.backgroundColor = color
  document.getElementById("result").style.color = color

  const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coin}&vs_currencies=usd`)
  const data = await response.json()
  document.getElementById("result").innerText = `${coin} price: $${data[coin].usd}`
}
    </script>
  </body>
</html>
